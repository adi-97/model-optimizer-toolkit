upstream = "https://api.anthropic.com"
host = "127.0.0.1"
port = 8787
classifier_model = "models/tier-full-v1"
min_confidence = 0.6
shadow = false
session_lock = true
lock_min_words = 5
never_upgrade_from = ["claude-haiku-4-5", "claude-haiku-5-5"]
retry_original_on_error = true
context_editing_tiers = []
store_prompts = false
db_path = "~/.laya-tier/usage.sqlite"

[routes.simple]
model = "claude-haiku-5-5"
effort = "low"

[routes.mid]
model = "claude-sonnet-5-5"
effort = "medium"

[routes.complex]
model = "claude-opus-5-5"

[budget]
action = "warn"
