[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "laya-tier"
version = "0.1.0"
description = "Task-complexity classifier on Laya and a local proxy that routes coding-agent requests by tier"
requires-python = ">=3.11"
dependencies = [
    "laya",
    "starlette>=0.37",
    "uvicorn>=0.27",
    "httpx>=0.27",
]

[project.scripts]
laya-tier = "laya_tier.cli:main"

[tool.setuptools]
packages = ["laya_tier", "laya_tier.proxy"]
