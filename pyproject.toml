[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adtok"
version = "0.1.0"
description = "Token optimizer for Claude Code: cache-safe layers, a cost ledger, a prefix doctor and a tier classifier"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
proxy = ["starlette>=0.37,<2", "uvicorn>=0.27", "httpx>=0.27,<1"]
classifier = ["laya", "starlette>=0.37,<2", "uvicorn>=0.27", "httpx>=0.27,<1"]
dev = ["starlette>=0.37,<2", "uvicorn>=0.27", "httpx>=0.27,<1", "httpx2>=2.16", "ruff"]

[project.scripts]
adtok = "adtok.cli:main"

[tool.setuptools.packages.find]
include = ["adtok*"]

[tool.setuptools.package-data]
"adtok.hybrid" = ["templates/*.md", "templates/agents/*.md"]
