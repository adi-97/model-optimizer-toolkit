name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      USE_TF: "0"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m adtok.cli --help
      - run: python -W error -c "import starlette.testclient"
      - run: python tests/test_layers.py
      - run: python tests/test_proxy.py
      - run: python tests/test_hybrid.py
      - run: python tests/test_harness.py
      - run: ruff check adtok/ tests/ scripts/ bench/ --select=E9,F63,F7,F82,F401,F811 --line-length=120
      - run: python -m compileall -q adtok tests scripts bench
